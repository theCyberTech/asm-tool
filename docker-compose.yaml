version: '3.8'

services:
  asm:
    build: .
    container_name: asm-tool
    volumes:
      # Persist data between runs
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      # Mount config file
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Australia/Perth
    # Override entrypoint for interactive use
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    # Network mode for scanning
    network_mode: host

  # Scheduled scan service (optional)
  asm-scheduler:
    build: .
    container_name: asm-scheduler
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Australia/Perth
    # Run scheduled scans
    command: ["schedule", "--cron", "0 6 * * *", "crewai.com"]
    restart: unless-stopped
    profiles:
      - scheduled
