# ASM Tool Configuration
# Copy this file to config.yaml and customize

# Domains to monitor
domains:
  - example.com

# Notification settings
notifications:
  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    # Prefer ASM_SMTP_USER / ASM_SMTP_PASSWORD (or SMTP_USER / SMTP_PASSWORD) over file values.
    # smtp_user: ""
    # smtp_password: ""
    from_addr: "alerts@yourdomain.com"
    to_addr: "security@yourdomain.com"

# Scanning configuration
scanning:
  # Common ports to scan
  ports: "21,22,23,25,53,80,110,143,443,445,993,995,3306,3389,5432,5900,8080,8443,8888,9000,9443"
  
  # Nuclei severity filter
  nuclei_severity: "medium,high,critical"
  
  # Use only passive reconnaissance (no active scanning)
  passive_only: false
  
  # Rate limit for scans (requests per second)
  rate_limit: 100

# Nuclei configuration
nuclei:
  concurrency: 25
  batch_size: 25
  exclude_tags: "dos,fuzz,brute"
  retries: 1

# External API integrations (optional)
hunter:
  api_key: ""

# Scheduling (cron expressions)
schedule:
  # Full scan daily at 6 AM
  full_scan: "0 6 * * *"
  
  # Certificate check every 6 hours
  cert_check: "0 */6 * * *"

# Dashboard server
dashboard:
  host: "127.0.0.1"
  port: 8080
  # Prefer ASM_DASHBOARD_TOKEN over a file value. Required when host is not loopback.
  # token: ""
