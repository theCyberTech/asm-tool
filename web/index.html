<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrewAI - ASM</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0d1117;
        color: #c9d1d9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event.target;
          if (!target || (target.tagName !== "SCRIPT" && target.tagName !== "LINK")) {
            return;
          }
          var root = document.getElementById("root");
          if (!root) {
            return;
          }
          root.innerHTML =
            "<h1>Dashboard failed to load</h1>" +
            "<p>The UI bundle is missing or blocked. Hard-refresh this page (Ctrl+Shift+R).</p>";
        },
        true,
      );
    </script>
  </head>
  <body bgcolor="#0d1117" text="#c9d1d9">
    <div id="root">CrewAI - ASM loading…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
