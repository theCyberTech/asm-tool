[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=asm
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=90
    -v
    --tb=short
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, file system)
    slow: Slow tests (network calls, external tools)
    external: Tests requiring external tools (nmap, subfinder, etc.)