{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}ASM Dashboard{{end}}</title>

    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- Alpine.js for lightweight interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        {{template "styles" .}}
    </style>
    {{block "head" .}}{{end}}
</head>
<body hx-boost="true" x-data="toastManager()">
    {{template "nav" .}}

    <div class="layout">
        {{template "sidebar" .}}

        <main class="main-content">
            {{if .Error}}
            <div class="alert alert-danger mb-md">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
                {{.Error}}
            </div>
            {{end}}
            {{block "content" .}}{{end}}
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="toast" :class="'toast-' + toast.type" x-show="toast.visible"
                 x-transition:enter="toast-enter"
                 x-transition:enter-start="toast-enter-start"
                 x-transition:enter-end="toast-enter-end"
                 x-transition:leave="toast-leave"
                 x-transition:leave-start="toast-leave-start"
                 x-transition:leave-end="toast-leave-end">
                <div class="toast-icon">
                    <template x-if="toast.type === 'error'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                    </template>
                    <template x-if="toast.type === 'success'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </template>
                    <template x-if="toast.type === 'warning'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                    </template>
                    <template x-if="toast.type === 'info'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                    </template>
                </div>
                <span class="toast-message" x-text="toast.message"></span>
                <button class="toast-close" @click="removeToast(toast.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <script>
    // Toast notification manager
    function toastManager() {
        return {
            toasts: [],
            toastCounter: 0,

            addToast(message, type = 'info', duration = 5000) {
                const id = ++this.toastCounter;
                const toast = { id, message, type, visible: true };
                this.toasts.push(toast);

                if (duration > 0) {
                    setTimeout(() => this.removeToast(id), duration);
                }
            },

            removeToast(id) {
                const toast = this.toasts.find(t => t.id === id);
                if (toast) {
                    toast.visible = false;
                    setTimeout(() => {
                        this.toasts = this.toasts.filter(t => t.id !== id);
                    }, 300);
                }
            },

            showError(message) { this.addToast(message, 'error', 8000); },
            showSuccess(message) { this.addToast(message, 'success'); },
            showWarning(message) { this.addToast(message, 'warning'); },
            showInfo(message) { this.addToast(message, 'info'); }
        };
    }

    // Global htmx error handling
    document.body.addEventListener('htmx:responseError', function(evt) {
        const toastEl = document.body;
        if (toastEl.__x) {
            const status = evt.detail.xhr.status;
            let message = 'An error occurred while loading data';

            if (status === 404) {
                message = 'The requested resource was not found';
            } else if (status === 500) {
                message = 'Server error. Please try again later';
            } else if (status === 0) {
                message = 'Network error. Please check your connection';
            }

            toastEl.__x.$data.showError(message);
        }
    });

    // Handle network errors
    document.body.addEventListener('htmx:sendError', function(evt) {
        const toastEl = document.body;
        if (toastEl.__x) {
            toastEl.__x.$data.showError('Network error. Please check your connection');
        }
    });

    // Handle timeout errors
    document.body.addEventListener('htmx:timeout', function(evt) {
        const toastEl = document.body;
        if (toastEl.__x) {
            toastEl.__x.$data.showWarning('Request timed out. Please try again');
        }
    });
    </script>

    {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
