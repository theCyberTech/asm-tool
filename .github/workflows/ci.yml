name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, test, and build the web app
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: asm-go/go.mod

      - name: Vet Go (legacy CLI)
        working-directory: asm-go
        run: go vet ./...

      - name: Test Go (legacy CLI)
        working-directory: asm-go
        run: go test ./...
