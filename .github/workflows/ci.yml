name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asm-go
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build TypeScript frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: asm-go/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
